name: Daily Job Fetch

on:
  # Runs HERE, not on Vercel: this job needs pandas + python-jobspy (installed
  # below from requirements.txt), real non-datacenter IPs the boards don't block,
  # and a writable checkout to git-push the feed branch. Vercel's function can do
  # none of those, so it only SERVES the feed this workflow publishes.
  #
  # 4 peak posting times, UTC (IST = UTC+5:30):
  #   03:00 UTC = 08:30 IST   |  07:00 UTC = 12:30 IST
  #   11:00 UTC = 16:30 IST   |  15:00 UTC = 20:30 IST
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # trigger manually from the Actions tab any time

permissions:
  contents: write

# Never let two fetches race each other onto the feed branch (a scheduled run
# overlapping a manual one would collide on `git push origin feed`).
concurrency:
  group: daily-job-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Job-level so EVERY step sees them (sync_projects_to_profile.py needs GROQ too).
    env:
      # Free Groq key. Powers the AI agent that reads each JD and scores
      # interview_likelihood / fit_level, plus JD-expiry checks and project
      # matching. WITHOUT IT every job silently scores 50% / "MAYBE" and the
      # feed records "groq unavailable for deep analysis".
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Free Tavily key switches ON LinkedIn "we're hiring" posts + web-discovered
      # ATS/career pages. Empty -> those sources stay off (not fatal).
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # Optional extra search source (extra_sources.py).
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Auto-provided by Actions; raises the GitHub API rate limit for the
      # portfolio-project fetch (projects_manager.py / project_curator.py).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load existing jobs from feed branch (to keep portfolio intact)
        run: python load_existing_jobs.py

      - name: Verify AI scoring key is present
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::warning title=GROQ_API_KEY missing::AI job scoring is DISABLED. Every job will score 50% / MAYBE. Add the secret at Settings > Secrets and variables > Actions."
          else
            echo "GROQ_API_KEY present - AI job scoring enabled."
          fi

      - name: Fetch jobs and write data/jobs.json
        run: python fetch_jobs.py

      - name: Sync portfolio projects to resume profile
        run: python sync_projects_to_profile.py

      - name: Stash resume_profile.py before switching branches
        run: git stash push -m "synced projects" resume_profile.py || true

      - name: Publish feed to the 'feed' branch (main untouched, no Vercel deploy)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/jobs.json "$RUNNER_TEMP/jobs.json"
          git checkout -- data/jobs.json
          git fetch origin feed || true
          if git show-ref --verify --quiet refs/remotes/origin/feed; then
            git checkout -B feed origin/feed
          else
            git checkout --orphan feed
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data
          cp "$RUNNER_TEMP/jobs.json" data/jobs.json
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add data/jobs.json vercel.json
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "chore: feed update [skip ci]"
            git push origin feed
          fi
