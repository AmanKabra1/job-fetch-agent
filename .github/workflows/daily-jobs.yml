name: Daily Job Fetch

on:
  schedule:
    # FOUR SEPARATE CRON SCHEDULES for reliability (GitHub Actions runs multiple times better as separate schedules)
    - cron: "0 3 * * *"    # 8:30 AM IST (morning peak)
    - cron: "0 7 * * *"    # 12:30 PM IST (noon)
    - cron: "0 11 * * *"   # 4:30 PM IST (afternoon peak)
    - cron: "0 15 * * *"   # 8:30 PM IST (evening batch)
  workflow_dispatch: {}   # trigger manually from the Actions tab any time

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load existing jobs from feed branch (to keep portfolio intact)
        run: |
          git fetch origin feed || true
          if git show-ref --verify --quiet refs/remotes/origin/feed; then
            mkdir -p data
            git show origin/feed:data/jobs.json > data/jobs.json 2>&1
            if [ ! -s data/jobs.json ]; then
              echo "Warning: Failed to load jobs from feed, starting with empty"
              echo '{"jobs":[]}' > data/jobs.json
            fi
          else
            echo "Feed branch not found"
          fi

      - name: Fetch jobs and write data/jobs.json
        env:
          # Free Tavily key (repo secret) switches ON LinkedIn "we're hiring" posts
          # + web-discovered ATS/company career pages. Empty → those sources stay off.
          # The cron runs 4 times a day, so Tavily runs on every run and still
          # fits the free tier (~4 runs/day × a handful of searches).
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python fetch_jobs.py

      - name: Publish feed to the 'feed' branch (main untouched, no Vercel deploy)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/jobs.json "$RUNNER_TEMP/jobs.json"
          git checkout -- data/jobs.json
          git fetch origin feed || true
          if git show-ref --verify --quiet refs/remotes/origin/feed; then
            git checkout -B feed origin/feed
          else
            git checkout --orphan feed
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data
          cp "$RUNNER_TEMP/jobs.json" data/jobs.json
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add data/jobs.json vercel.json
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "chore: feed update [skip ci]"
            git push origin feed
          fi
